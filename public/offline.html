<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProGrafter — Offline</title>
    <link rel="icon" href="/icons/icon-192.png" />
    <style>
      :root {
        --navy: #0F2238;
        --navy-2: #1B3A5C;
        --teal: #0D9488;
        --ink: #F5F1EA;
        --muted: #B7C2D0;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; }
      body {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        background: var(--navy);
        color: var(--ink);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background-image:
          radial-gradient(800px 400px at 80% -10%, rgba(13,148,136,0.18), transparent 60%),
          radial-gradient(600px 400px at -10% 110%, rgba(27,58,92,0.6), transparent 60%);
      }
      .card {
        max-width: 480px;
        width: 100%;
        background: rgba(27, 58, 92, 0.55);
        border: 1px solid rgba(13, 148, 136, 0.35);
        border-radius: 16px;
        padding: 32px 28px;
        text-align: center;
        backdrop-filter: blur(8px);
      }
      .badge {
        display: inline-block;
        font-family: 'DM Mono', ui-monospace, monospace;
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--teal);
        border: 1px solid rgba(13,148,136,0.5);
        padding: 6px 10px;
        border-radius: 999px;
        margin-bottom: 18px;
      }
      h1 {
        font-family: 'Bebas Neue', Impact, sans-serif;
        font-weight: 400;
        font-size: 44px;
        line-height: 1;
        letter-spacing: 0.02em;
        margin: 0 0 14px;
      }
      p { color: var(--muted); line-height: 1.55; margin: 0 0 22px; font-size: 15px; }
      button {
        font-family: inherit;
        background: var(--teal);
        color: #06231F;
        border: none;
        border-radius: 8px;
        padding: 12px 22px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        letter-spacing: 0.02em;
      }
      button:hover { filter: brightness(1.08); }
      .pg {
        width: 56px; height: 56px; border-radius: 12px;
        background: var(--navy-2);
        border: 1px solid rgba(13,148,136,0.4);
        display: inline-flex; align-items: center; justify-content: center;
        font-family: 'Bebas Neue', Impact, sans-serif; font-size: 26px;
        margin-bottom: 18px;
      }
    </style>
    <script>
      (function () {
        async function recoverIfOnline() {
          if (!navigator.onLine || !("serviceWorker" in navigator)) return;

          try {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map((registration) => registration.unregister()));
          } catch {
          }

          window.location.replace("/");
        }

        window.addEventListener("online", recoverIfOnline);
        window.addEventListener("pageshow", recoverIfOnline);
      })();
    </script>
  </head>
  <body>
    <main class="card">
      <div class="pg">PG</div>
      <div class="badge">Offline</div>
      <h1>You appear to be offline</h1>
      <p>Your daily updates will be saved and submitted automatically when you reconnect.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
